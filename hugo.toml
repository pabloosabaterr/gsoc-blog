baseURL = 'https://pablosabater.dev/'
languageCode = 'en'
title = 'Pablo Sabater'
copyright = 'Pablo Sabater'
enableRobotsTXT = true

[pagination]
  pagerSize = 1000

[taxonomies]
  tag = 'tags'
  project = 'projects'

[permalinks]
  [permalinks.page]
    posts = '/posts/:contentbasename/'
    life = '/life/:contentbasename/'

[params]
  author = 'Pablo Sabater'
  description = 'Pablo Sabater writes about the things he builds, breaks and learns: compilers, systems, open source and more.'
  # One line under the intro on the home page. Edit it whenever life changes.
  now = 'on an Erasmus semester at NOVA in Lisbon, and building [Orn](https://github.com/pabloosabaterr/Orn-rework), my own programming language.'
  repo = 'https://github.com/pabloosabaterr/gsoc-blog'
  github = 'https://github.com/pabloosabaterr'
  linkedin = 'https://www.linkedin.com/in/pablosabaterjimenez/'
  email = 'pablo@pablosabater.dev'
  recentPosts = 15

[menus]
  [[menus.main]]
    name = 'Writing'
    pageRef = '/posts'
    weight = 1
  [[menus.main]]
    name = 'Life'
    pageRef = '/life'
    weight = 2
  [[menus.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 3
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 4

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.extras.mark]
    enable = true
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html', 'rss']

[services.rss]
  limit = -1

[imaging]
  quality = 78
  resampleFilter = 'Lanczos'
