<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{{ partial "header.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{- $lp := resources.Get "js/preview.js" | minify | fingerprint }}
<script src="{{ $lp.RelPermalink }}" integrity="{{ $lp.Data.Integrity }}" defer></script>
</body>
</html>
